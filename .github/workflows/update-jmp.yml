name: Update JMP from Overleaf

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out working-papers repository
        uses: actions/checkout@v4

      - name: Clone latest Overleaf project
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          cat > /tmp/askpass.sh <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) echo "git" ;;
            *Password*) echo "$OVERLEAF_TOKEN" ;;
          esac
          EOF

          chmod +x /tmp/askpass.sh

          GIT_ASKPASS=/tmp/askpass.sh \
          GIT_TERMINAL_PROMPT=0 \
          git clone https://git.overleaf.com/6aace9b75f53bb68fd4da756 overleaf-project

      - name: Compile LaTeX paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: overleaf-project

      - name: Replace JMP PDF
        run: |
          cp overleaf-project/main.pdf Property_Tax_Firms_jmp.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Property_Tax_Firms_jmp.pdf

          if git diff --cached --quiet; then
            echo "The PDF has not changed."
            exit 0
          fi

          git commit -m "Update JMP from Overleaf"
          git push
